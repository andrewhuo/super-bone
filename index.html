
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super Bone</title>
  <style>
    body {
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
    }
    input {
      padding: 12px;
      width: 70%;
      max-width: 400px;
      border-radius: 6px;
    }
    button {
      padding: 12px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Super Bone</h1>
  <p>My personal game portal</p>
  <input id="url" value="https://florr.io">
  <button onclick="openGame()">Open Game</button>

  <script>
    function openGame() {
      const url = document.getElementById("url").value;
      window.location.href = url;
    }
  </script>
</body>
</html>
