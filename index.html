
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Super Bone</title>
</head>
<body>
  <h1>Super Bone</h1>
  <p id="status">Connecting...</p>
  <button id="test" disabled>Test Connection</button>
  <p id="result"></p>

  <script>
    const socket = new WebSocket(
      "wss://purple-queen-c16d.andrewmhuo.workers.dev/"
    );

    socket.onopen = () => {
      document.getElementById("status").textContent =
        "Connected!";
      document.getElementById("test").disabled = false;
    };

    socket.onmessage = (event) => {
      document.getElementById("result").textContent =
        "Server replied: " + event.data;
    };

    socket.onerror = () => {
      document.getElementById("status").textContent =
        "Connection error";
    };

    socket.onclose = () => {
      document.getElementById("status").textContent =
        "Disconnected";
    };

    document.getElementById("test").onclick = () => {
      socket.send("Hello from Super Bone!");
    };
  </script>
</body>
</html>
